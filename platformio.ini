; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs=
;	esp32dev
;	esp32-s3-devkitm-1
; 	sparkfun_esp32_iot_redboard
	adafruit_metro_esp32s3

[common]
build_flags =
	-std=gnu++17

build_unflags = -std=gnu++11

; Injects the firmware version and environment name used for OTA updates
extra_scripts = post:scripts/version.py

lib_deps =
    Wire
	SPI
	bitbank2/AnimatedGIF@^2.2.3
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
	adafruit/Adafruit GFX Library@^1.12.6
;	adafruit/Adafruit BusIO@^1.9.9
	tzapu/WiFiManager@^2.0.17
	ropg/ezTime@^0.8.3
	bblanchon/ArduinoJson@^7.4.3
;	esp32async/ESPAsyncWebServer@^3.7.7
	hmueller01/PubSubClient3@^3.3.0
;	arduino-libraries/Ethernet@^2.0.2
	greiman/SdFat@^2.3.1

[env:esp32dev]
platform = espressif32
board = esp32dev
; The default partitions only offer 1.25MB per app, which is too small
board_build.partitions = min_spiffs.csv
framework = arduino
extra_scripts =
	${common.extra_scripts}
monitor_speed = 115200
build_unflags =
	${common.build_unflags}
build_flags =
    ${common.build_flags}
lib_deps =
    ${common.lib_deps}

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
; Full 8MB layout with 3.2MB per app
board_build.partitions = default_8MB.csv
framework = arduino
extra_scripts =
	${common.extra_scripts}
board_upload.wait_for_upload_port = false ; Waiting isn't needed for CDC/JTAG USB mode
monitor_speed = 115200
build_unflags =
	${common.build_unflags}
build_flags =
    ${common.build_flags}
	-D ARDUINO_USB_MODE=1 ; CDC/JTAG USB mode
	; Needed for USB to enumerate when user code starts
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${common.lib_deps}

[env:sparkfun_esp32_iot_redboard]
platform = espressif32
board = sparkfun_esp32_iot_redboard
; The default partitions only offer 1.25MB per app, which is too small
board_build.partitions = min_spiffs.csv
framework = arduino
extra_scripts =
	${common.extra_scripts}
monitor_speed = 115200
build_unflags =
	${common.build_unflags}
build_flags =
    ${common.build_flags}
lib_deps =
    ${common.lib_deps}

[env:adafruit_metro_esp32s3]
platform = espressif32
board = adafruit_metro_esp32s3
; Full 16MB layout with 6.25MB per app
board_build.partitions = default_16MB.csv
framework = arduino
extra_scripts =
	${common.extra_scripts}
board_upload.wait_for_upload_port = false ; Waiting isn't needed for CDC/JTAG USB mode
monitor_speed = 115200
build_unflags =
	${common.build_unflags}
build_flags =
    ${common.build_flags}
	-D ARDUINO_USB_MODE=1 ; CDC/JTAG USB mode
	; Needed for USB to enumerate when user code starts
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${common.lib_deps}
