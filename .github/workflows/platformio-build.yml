name: PlatformIO build

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Build every supported platform, a failing one does not cancel the others
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32dev
          - esp32-s3-devkitm-1
          - sparkfun_esp32_iot_redboard
          - adafruit_metro_esp32s3

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    # The platformio package from nixpkgs runs inside an FHS environment based
    # on user namespaces, which Ubuntu restricts by default via AppArmor
    - name: Allow unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # shell.nix imports <nixpkgs>, so a channel needs to be on the NIX_PATH
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    # Cache the PlatformIO toolchains, frameworks and libraries
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio/libdeps
        key: pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
        restore-keys: pio-${{ matrix.environment }}-

    - name: Build firmware
      run: nix-shell --run "pio run -e ${{ matrix.environment }}"
