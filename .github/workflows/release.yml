name: Release

# Builds the firmware for all platforms when a version tag (e.g. v0.1.0) is
# pushed and publishes it together with the OTA manifest as GitHub release
on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - esp32dev
          - esp32-s3-devkitm-1
          - sparkfun_esp32_iot_redboard
          - adafruit_metro_esp32s3

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    # The platformio package from nixpkgs runs inside an FHS environment based
    # on user namespaces, which Ubuntu restricts by default via AppArmor
    - name: Allow unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # shell.nix imports <nixpkgs>, so a channel needs to be on the NIX_PATH
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio/libdeps
        key: pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
        restore-keys: pio-${{ matrix.environment }}-

    # The version is read by scripts/version.py
    - name: Build firmware
      env:
        ESPINDMD_VERSION: ${{ github.ref_name }}
      run: nix-shell --run "pio run -e ${{ matrix.environment }}"

    - name: Collect firmware
      run: |
        mkdir -p dist
        cp .pio/build/${{ matrix.environment }}/firmware.bin \
          dist/esPINDMD-${{ matrix.environment }}.bin

    - uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.environment }}
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        pattern: firmware-*
        merge-multiple: true
        path: dist/

    - name: Generate manifest
      run: |
        python3 scripts/manifest.py dist "${{ github.ref_name }}" \
          --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
          --summary "esPINDMD firmware ${{ github.ref_name }}"

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" dist/* \
          --title "esPINDMD ${{ github.ref_name }}" \
          --generate-notes
